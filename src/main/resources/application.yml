server:
  port: ${TRACKER_PORT:8080}
  # Loopback only, deliberately. This process holds a live session cookie in memory and can
  # push to the record repository; a bind on 0.0.0.0 (the Spring default, and what a
  # container gives you for free) would offer /watch to everything on the LAN. Design §4.1.
  address: ${TRACKER_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: programmers-tracker
  # Inbound (/watch, MCP) runs on virtual threads; outbound observation uses coroutines
  # + Ktor. Layered on purpose — see the ADR 2026-08-05-backend-stack.
  threads:
    virtual:
      enabled: true

# Measured protocol facts as defaults (protocol doc §1, §10); overridable per dev rules §9.1.
tracker:
  cable:
    url: ${TRACKER_CABLE_URL:wss://ws.programmers.co.kr:443/cable}
    origin: ${TRACKER_CABLE_ORIGIN:https://school.programmers.co.kr}
  session-file: ${TRACKER_SESSION_FILE:.ps/session}
  # Where records are written. Kept out of this repository entirely — solving records
  # belong in ps-records (CLAUDE.md), and the default must not be a developer's path.
  record-repo: ${TRACKER_RECORD_REPO:~/ps-records}
  # One instance per record repository, enforced with an OS file lock taken at startup
  # (ADR 2026-08-05-write-serialization decision 5). A container and a native run on the
  # same bind mount are two writers, and the second refuses to start. Off only for a
  # filesystem that cannot lock at all — then nothing enforces it, so run exactly one.
  record-repo-lock: ${TRACKER_RECORD_REPO_LOCK:true}
  # Live session frames, before a grading settles and its file moves into attempts/.
  raw-dir: ${TRACKER_RAW_DIR:.ps/raw}
  timers-file: ${TRACKER_TIMERS_FILE:.ps/timers.json}
  backup:
    # The daily push that carries up the problems no pass ever pushed (design §4.6). A missed
    # run is caught up rather than skipped, so the tick only asks whether the most recent
    # scheduled hour has been backed up — it is not the schedule itself.
    at: ${TRACKER_BACKUP_AT:23:00}
    zone: ${TRACKER_BACKUP_ZONE:Asia/Seoul}
    check-interval: ${TRACKER_BACKUP_CHECK_INTERVAL:PT1M}
    state-file: ${TRACKER_BACKUP_STATE_FILE:.ps/backup.json}
  watch:
    # Local authorization for POST /watch. Loopback is shared with every other process on
    # the machine, so the bind above is not authorization by itself. There is no default
    # token value and no way to switch the check off: left empty, the server generates one
    # on first start and persists it owner-only at token-file, so it survives restarts
    # (the extension heartbeats every 30 s — a per-run token would 401 every heartbeat).
    token: ${TRACKER_WATCH_TOKEN:}
    token-file: ${TRACKER_WATCH_TOKEN_FILE:.ps/watch-token}
  mcp:
    # POST /mcp reads the whole solving history, so it is guarded by the SAME token as
    # /watch above — one process, one local credential. What is configured here is only
    # the DNS-rebinding defence the MCP specification requires: browsers that may call the
    # endpoint, as a comma-separated list of origins. Empty means none, which is what a
    # native MCP client needs (it sends no Origin at all) and what keeps a page the user
    # merely visited from being rebound onto loopback.
    allowed-origins: ${TRACKER_MCP_ALLOWED_ORIGINS:}
