name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells us nothing; cancel it rather than paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No workflow expression here reaches a shell: the only interpolations are our own
# matrix values and the ref in the concurrency key, never event-supplied text.

jobs:
  # The gates the constitution requires before anything is called done, run on every
  # platform this tool claims to support. Windows and macOS are not redundant here:
  # the tool resolves paths like `.ps/session` and will ship in Docker for both.
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Pinned for the same reason the JDK is. JavascriptRunnerExecutionTest skips politely when
      # node is absent — right on a contributor's machine — and the skip-guard below turns that
      # skip into a failure, because a runner image quietly dropping a toolchain must not silently
      # un-earn a language's supported status. Twice the Windows image arrived without node (#174,
      # #208), and rerunning until it passes trains us to rerun on a guard failure, which is how a
      # guard stops meaning anything. The proof now rests on this declaration, not on the image.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The same declaration, arrived at the same way and one incident later (#319). On
      # 2026-08-14 the Windows image came without dotnet, `CsharpRunnerExecutionTest` skipped
      # all 8, the guard below fired — and the fix applied was a re-run, which passed. That is
      # exactly the training the node comment above warns about, performed on the very next
      # guard failure after it was written.
      #
      # `net8.0` is what `CsharpRunner` writes into the generated csproj, so the pin follows the
      # generator rather than the image's current default.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      # Python was inherited for the same reason dotnet was: it is on every image, until it is
      # not. Nothing has dropped it yet — this is the cheap half of not waiting to find out.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v5

      # The two toolchains with no first-party action to pin them. Both C suites accept either
      # compiler, so this asserts the *pair* the tests will look for rather than a product name.
      #
      # Inheriting these is a smaller bet than inheriting dotnet was — a C compiler is load-bearing
      # for the images themselves, not a product shipped alongside — but "smaller" is not "none",
      # and the failure it would otherwise produce is the one #319 is about: a skip several steps
      # away from a grep that infers why. Failing here names the missing binary at setup time.
      - name: the C and C++ compilers no action pins are present
        shell: bash
        run: |
          set -e
          for pair in "gcc clang" "g++ clang++"; do
            found=""
            for tool in $pair; do
              command -v "$tool" >/dev/null 2>&1 && found="$tool"
            done
            if [ -z "$found" ]; then
              echo "MISSING: none of [$pair] is on PATH."
              echo "The C/C++ execution proof would skip, and the skip-guard would call it a regression."
              exit 1
            fi
            echo "$pair → $found ($($found --version 2>&1 | head -1))"
          done

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      # Wrapped rather than run directly: no test may write to a home-directory default,
      # and the wrapper is what makes that a failure instead of a surprise in someone's
      # home directory. `shell: bash` because the Windows runner defaults to pwsh.
      - name: test (unit + layer only — integration never runs in CI)
        shell: bash
        run: ./scripts/no-home-writes.sh ./gradlew test verifyEveryTestClassRan --no-daemon

      # A language is "supported" only while its execution suite actually runs (#78). The
      # suite skips politely where the interpreter is missing — right for a contributor's
      # machine, wrong here: a runner image that dropped python would silently un-earn the
      # status. Asserted from the results file, not assumed from runner documentation.
      - name: the runner execution proofs genuinely ran
        shell: bash
        run: |
          set -e
          # Each execution suite skips politely where its interpreter/compiler is missing —
          # right on a contributor's machine, wrong here: a runner image quietly dropping a
          # toolchain must not silently un-earn a language's supported status.
          for suite in JavaRunnerExecutionTest PythonRunnerExecutionTest CppRunnerExecutionTest \
                       JavascriptRunnerExecutionTest KotlinRunnerExecutionTest CRunnerExecutionTest \
                       CsharpRunnerExecutionTest; do
            results="build/test-results/test/TEST-com.brokenfinger.tracker.domain.calc.runner.$suite.xml"
            [ -f "$results" ] || { echo "REGRESSION: $suite left no results at all."; exit 1; }
            if grep -q "<skipped" "$results"; then
              echo "REGRESSION: $suite was SKIPPED on this runner — toolchain missing?"
              grep -o 'skipped[^/]*' "$results" | head -3
              exit 1
            fi
            echo "$suite ran: $(grep -o 'tests="[0-9]*"' "$results" | head -1)"
          done

      - name: build
        run: ./gradlew build -x test --no-daemon

      - name: branch coverage floors
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew verifyBranchCoverage --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results/test/
          if-no-files-found: ignore

  # Two of this project's three CI failures were non-deterministic and passed locally every
  # time. Repeating the suite is the only way a green run can mean "reliably green" rather
  # than "green once". Runs without the build cache, because a cached test task once made a
  # broken guard look green.
  repeatability:
    name: repeatability (no cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # This job runs the same execution suites `gates` does, and had only the JDK declared
      # (#319). It carries no skip-guard, so a missing toolchain here does not fail — it skips,
      # three times, and the job reports green. That is the one claim this job exists to make:
      # "reliably green" rather than "green once". Eight C# tests skipping on all three attempts
      # would satisfy it exactly as well as eight passing ones.
      #
      # The declarations, not a second guard: `gates` also runs on ubuntu-latest, so an image
      # that drops one of these fails there loudly. What this job needed was to stop depending
      # on the image at all.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v5

      - name: Run the suite three times from a clean state
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            start=$(date +%s)
            # `--rerun`, not `--rerun-tasks`: this job wants the *test task* to run three times,
            # not three identical Kotlin compilations. Both guarantees the comment above asks for
            # survive — the task really executes, and no build cache is consulted (#245).
            ./gradlew test verifyEveryTestClassRan --no-daemon --no-build-cache --rerun
            echo "attempt $attempt took $(( $(date +%s) - start ))s"
            echo "::endgroup::"
          done

      # This job exists to catch what only fails sometimes, and until now it threw the evidence
      # away: it uploaded nothing, so its first real catch — a RecordWriterGitTest failure on
      # 2026-08-12 — arrived as `JUnitException at ArrayList.java:1604, caused by IOException at
      # ForEachOps.java:186` and nothing else. The job log truncates stack traces; the uploaded
      # report does not (concepts/assumption-vs-measurement, "Read the failure, do not
      # pattern-match it"). The gates job has always uploaded; the one job whose failures are
      # hardest to reproduce did not.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-repeatability
          path: build/test-results/test/
          if-no-files-found: ignore

  # The image has to boot, and the network posture it ships with has to be the one the
  # ADR describes. Both are asserted rather than described, because a compose comment
  # cannot fail a build and this is exactly the nuance a later reader "simplifies".
  #
  # UBUNTU ONLY, AND THAT IS A DECISION. The gates job runs on all three operating
  # systems because the tool resolves paths on all three; Docker does not need the same
  # treatment. The macOS and Windows runners have no native Docker daemon — they need a
  # nested VM, which makes an image build several times slower and measurably flakier.
  # A Linux image is a Linux image whichever host built it, so the extra two jobs would
  # buy a longer, less reliable pipeline and no additional signal. Deliberately NOT
  # folded into the `gates` matrix for the same reason.
  docker:
    name: docker image boots (ubuntu only — see comment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Through buildx with the Actions layer cache rather than a bare `docker build` (#298).
      # The Gradle that matters runs *inside* the image, where `setup-gradle`'s host cache does
      # not reach — so every run re-downloaded Spring Boot, Ktor and the rest, and one of them
      # took a 429 from Maven Central for it. The Dockerfile already isolates dependency
      # resolution in its own layer; this is what finally reuses it.
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: programmers-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A record repository and a state directory per container, the way a user would mount
      # them. One directory each and not one shared: these two steps are about network
      # posture, and since #44 a shared records mount would make the second container refuse
      # to start — correctly, but for a reason that has nothing to do with what they test.
      # The lock gets its own step below.
      - name: Prepare the mounts
        run: |
          set -e
          for name in default exposed shared; do
            mkdir -p "$RUNNER_TEMP/records-$name" "$RUNNER_TEMP/state-$name"
            git -C "$RUNNER_TEMP/records-$name" init -q
          done
          mkdir -p "$RUNNER_TEMP/state-second"

      # The image ships the application default, which is a loopback bind. Inside a
      # container namespace that makes the published port unreachable — the property this
      # step pins. If someone drops `server.address` from application.yml, the container
      # becomes reachable here and this fails.
      - name: A default-bind container is NOT reachable through a published port
        run: |
          set -e
          docker run -d --name tracker-default -p 127.0.0.1:11619:1619 \
            --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/records-default":/records -v "$RUNNER_TEMP/state-default":/app/.ps \
            programmers-tracker:ci
          for _ in $(seq 1 60); do
            docker logs tracker-default 2>&1 | grep -q "Started TrackerApplication" && break
            sleep 2
          done
          docker logs tracker-default 2>&1 | grep -q "Started TrackerApplication" \
            || { echo "the container never finished starting"; docker logs tracker-default; exit 1; }
          if curl -sS -m 5 -o /dev/null http://127.0.0.1:11619/; then
            echo "REGRESSION: the published port served a request at the default bind."
            echo "The in-container bind is no longer loopback — see the ADR"
            echo "2026-08-06-container-network-posture before changing this."
            exit 1
          fi
          echo "unreachable at the default bind, as expected"

      # What compose actually runs. Reachable, still guarded by the token, and healthy.
      - name: A 0.0.0.0-bind container serves, and /watch still refuses an untokened call
        run: |
          set -e
          docker run -d --name tracker-exposed -e TRACKER_BIND_ADDRESS=0.0.0.0 \
            -p 127.0.0.1:18081:1619 --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/records-exposed":/records -v "$RUNNER_TEMP/state-exposed":/app/.ps \
            programmers-tracker:ci
          for _ in $(seq 1 60); do
            curl -sS -m 5 -o /dev/null http://127.0.0.1:18081/ && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/)" = "404" \
            || { echo "the server is not answering HTTP"; docker logs tracker-exposed; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18081/watch \
            -H 'Content-Type: application/json' -d '{}')" = "401" \
            || { echo "/watch answered an untokened call with something other than 401"; exit 1; }

      # The record-repository lock across a real bind mount on a native Linux host — the
      # case 2026-08-06-record-repository-lock could only label expected-but-unverified,
      # because Docker Desktop's virtualised mount silently honours no lock at all and that
      # is the only host the ADR could measure. This runner is the missing measurement, and
      # keeping it here means a regression is caught rather than rediscovered.
      - name: A second container on the same records mount is refused
        run: |
          set -e
          docker run -d --name tracker-holder --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/records-shared":/records -v "$RUNNER_TEMP/state-shared":/app/.ps \
            programmers-tracker:ci
          for _ in $(seq 1 60); do
            docker logs tracker-holder 2>&1 | grep -q "Started TrackerApplication" && break
            sleep 2
          done
          docker logs tracker-holder 2>&1 | grep -q "Started TrackerApplication" \
            || { echo "the holder never started"; docker logs tracker-holder; exit 1; }

          # Foreground on purpose: docker run propagates the exit code, and Spring Boot
          # exits non-zero when the context fails to refresh.
          if docker run --name tracker-second --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/records-shared":/records -v "$RUNNER_TEMP/state-second":/app/.ps \
            programmers-tracker:ci >second.log 2>&1; then
            echo "REGRESSION: a second instance started while another held /records."
            echo "Either the lock stopped working or this filesystem does not enforce it."
            exit 1
          fi
          grep -q "APPLICATION FAILED TO START" second.log \
            || { echo "it failed, but not as a diagnosed refusal:"; tail -40 second.log; exit 1; }
          grep -q "already held by another programmers-tracker instance" second.log \
            || { echo "it failed for some other reason:"; tail -40 second.log; exit 1; }
          echo "refused, as it must be"

      # Every binary the documentation tells a user to rely on. Their absence is invisible
      # from outside — `docker compose config` validates, mounts resolve, and the failure
      # only appears at the moment a push is attempted (#56: ssh was missing while
      # compose.yaml documented SSH credentials). Asserting presence is cheap; discovering
      # it from a user's failed backup is not.
      # A running instance must be able to say which build it is. `docker compose up` reuses
      # a tagged image without rebuilding, so the failure mode is running last week's code
      # with no symptom at all beyond a log line that never appears (#60) — and this tool
      # records data that cannot be re-fetched, so a stale image writes wrong records quietly.
      - name: The image says which build it is
        run: |
          set -e
          logs=$(docker logs tracker-exposed 2>&1)
          echo "$logs" | grep -q "Running build" \
            || { echo "REGRESSION: the image does not announce its build identity."; \
                 echo "Without it a stale image is indistinguishable from a fresh one — see #60."; \
                 echo "$logs" | head -30; exit 1; }
          # An unstamped build means build-info.properties never reached the jar, which looks
          # identical from outside and defeats the whole point.
          if echo "$logs" | grep -q "Running an unstamped build"; then
            echo "REGRESSION: the image carries no build-info.properties, so its stamp is empty."
            exit 1
          fi
          echo "$logs" | grep -m1 "Running build"

      - name: The image ships the tools the docs promise
        run: |
          set -e
          # `ssh` was on this list from #56 until #258 retired the SSH push path. Pushes now
          # authenticate over HTTPS with the token's credential store, so the image carries no
          # openssh-client and this check would fail for the right reason.
          for binary in git curl; do
            docker run --rm --entrypoint sh programmers-tracker:ci -c "command -v $binary" >/dev/null \
              || { echo "REGRESSION: '$binary' is not in the image."; \
                   echo "compose.yaml and docs/bootstrap.md tell users it is there — see #56."; \
                   exit 1; }
          done
          echo "git and curl are both present"

      - name: The HEALTHCHECK reports healthy
        run: |
          set -e
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tracker-exposed)" = "healthy" ] && exit 0
            sleep 5
          done
          echo "health never reached healthy: $(docker inspect -f '{{.State.Health.Status}}' tracker-exposed)"
          docker inspect -f '{{json .State.Health}}' tracker-exposed
          exit 1

      # Catches an interpolation or schema error in compose.yaml without starting it. The
      # values are throwaway; the point is that every required variable is declared. All
      # of them are our own literals or runner paths — no event-supplied text, per the
      # note at the top of this file.
      - name: compose.yaml resolves
        env:
          TRACKER_RECORD_REPO: ${{ runner.temp }}/records-default
          TRACKER_STATE_DIR: ${{ runner.temp }}/state-default
          TRACKER_SESSION_FILE: ${{ runner.temp }}/state-default/session
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
        run: |
          set -e
          touch "$TRACKER_SESSION_FILE"
          docker compose config --quiet
          # The loopback prefix on the publish address is the whole control (ADR
          # 2026-08-06-container-network-posture). Assert it survived.
          docker compose config | grep -q 'published: "1619"'
          docker compose config | grep -q 'host_ip: 127.0.0.1'

      - name: Container logs
        if: always()
        run: |
          for name in tracker-default tracker-exposed tracker-holder tracker-second; do
            echo "--- $name"
            docker logs "$name" 2>&1 | tail -40 || echo "(never started)"
          done

  # Rules CLAUDE.md states that the compiler cannot enforce. The same script runs
  # locally, so CI and a developer's machine can never disagree.
  guards:
    name: constitution guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/guards.sh

  # Report-only: the point is seeing which failure branches are never exercised,
  # not defending a number.
  #
  # The one job that runs the suite and is deliberately left with only the JDK declared (#319).
  # A skipped execution suite cannot move this number: #283/#285 measured the runner package at
  # 575/862 with all 49 execution tests running and the identical figure without them, because
  # what they prove is that generated code compiles and passes, not that a new branch was taken.
  # Declaring three toolchains here would buy nothing and imply they mattered to the number.
  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Kover report
        run: ./gradlew koverXmlReport koverHtmlReport --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/
          if-no-files-found: ignore
