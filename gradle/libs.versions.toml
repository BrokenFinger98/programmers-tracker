[versions]
kotlin = "2.4.10"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
ktlint = "14.2.0"
kover = "0.9.9"

# Kept as plain versions because they are ALSO forced onto Spring Boot's BOM in
# build.gradle.kts — see the override block there for why.
coroutines = "1.11.0"
serialization = "1.11.0"

ktor = "3.5.2"
# The problem statement is a nested HTML fragment. Regex reads one attribute off one tag
# (SavedCodePage, ProblemIdentityPage) and has no business converting a document — see
# decisions/2026-08-13-a-floor-per-package-and-a-reason-per-exception on matching nested
# markup by hand. jsoup also never throws on malformed input, which is the posture
# development-rules §2 asks of everything that reads Programmers.
jsoup = "1.21.2"
kotest = "6.2.3"
mockk = "1.14.11"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
# Test-only: the Kotlin runner's execution suite compiles its generated source with the
# same compiler kotlinc wraps — hermetic on every CI runner, no kotlinc install step (#84)
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Coroutine-native WebSocket client, confined to the protocol package
# (ADR 2026-08-04-ktor-websocket-client).
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# @WebMvcTest left the starter in Boot 4 — it now ships in its own module.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }

kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
